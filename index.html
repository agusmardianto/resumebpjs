<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Rawat Inap - BPJS Kesehatan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toolbar no-print">
    <div>
      <strong>Resume Medis BPJS</strong>
      <span>Isi formulir, lalu cetak atau simpan sebagai PDF.</span>
    </div>
    <div class="toolbar-actions">
      <button type="button" class="btn btn-light" id="resetBtn">Kosongkan Form</button>
      <button type="button" class="btn btn-primary" id="printBtn">Cetak / Simpan PDF</button>
    </div>
  </div>

  <main class="paper" id="resume">
    <header class="form-header">
      <div class="logo">
        <img src="BPJS Kesehatan Logo.svg" alt="Logo BPJS Kesehatan">
        </div>
      </div>
      <h1>RESUME RAWAT INAP</h1>
    </header>

    <form id="resumeForm" autocomplete="off">
      <section class="form-section">
        <h2>IDENTITAS</h2>
        <div class="fields">
          <label><span>Nama</span><input name="nama" type="text"></label>
          <label><span>Nomor JKN</span><input name="jkn" type="text"></label>
          <label><span>Tanggal Lahir</span><input name="tanggal_lahir" type="date"></label>
          <label><span>Usia</span><input name="usia" type="text" placeholder="Tahun"></label>
          <label><span>Alamat</span><input name="alamat" type="text"></label>
          <label><span>No HP Peserta/Keluarga <small>(Wajib diisi)</small></span><input name="no_hp" type="tel" required></label>
        </div>
        <div class="stay-grid">
          <div class="stay-label">Masuk</div>
          <div class="stay-date">Tanggal <input name="tanggal_masuk" type="date"> <span>Jam</span> <input name="jam_masuk" type="time"></div>
          <div class="stay-label">Pulang</div>
          <div class="stay-date">Tanggal <input name="tanggal_pulang" type="date"> <span>Jam</span> <input name="jam_pulang" type="time"></div>
          <div class="stay-label">No. RM</div>
          <div class="stay-date"><input class="short-line" name="no_rm" type="text" aria-label="Nomor rekam medis"></div>
        </div>
      </section>

      <section class="form-section">
        <h2>ANAMNESA</h2>
        <div class="fields lined">
          <label><span>Riwayat Penyakit Dahulu</span><textarea name="riwayat_penyakit" rows="1"></textarea></label>
          <label><span>Keluhan Saat Masuk</span><textarea name="keluhan" rows="3"></textarea></label>
          <label><span>Diagnosa Utama</span><textarea name="diagnosa" rows="1"></textarea></label>
          <label><span>Riwayat Alergi</span><textarea name="alergi" rows="1"></textarea></label>
        </div>
      </section>

      <section class="form-section">
        <h2>PEMERIKSAAN FISIK</h2>
        <div class="fields lined">
          <label><span>Kondisi umum</span><textarea name="kondisi_umum" rows="1"></textarea></label>
        </div>
            <div class="vitals">
                <label>
                    <span>TD (Tekanan Darah)</span>
                    <div class="input-unit">
                        <input name="td" type="text" placeholder="120/80">
                        <span class="unit">mmHg</span>
                    </div>
                </label>
            
                <label>
                    <span>RR (Frekuensi Napas)</span>
                    <div class="input-unit">
                        <input name="rr" type="number" placeholder="20">
                        <span class="unit">x/menit</span>
                    </div>
                </label>
            
                <label>
                    <span>Nadi</span>
                    <div class="input-unit">
                        <input name="nadi" type="number" placeholder="80">
                        <span class="unit">x/menit</span>
                    </div>
                </label>
            
                <label>
                    <span>Suhu</span>
                    <div class="input-unit">
                        <input name="suhu" type="number" step="0.1" placeholder="36.5">
                        <span class="unit">°C</span>
                    </div>
                </label>
            
                <label>
                    <span>BB (Berat Badan)</span>
                    <div class="input-unit">
                        <input name="bb" type="number" step="0.1" placeholder="60">
                        <span class="unit">kg</span>
                    </div>
                </label>
            
                <label>
                    <span>TB (Tinggi Badan)</span>
                    <div class="input-unit">
                        <input name="tb" type="number" step="0.1" placeholder="165">
                        <span class="unit">cm</span>
                    </div>
                </label>
            </div>
      </section>

      <section class="form-section">
        <h2>PEMERIKSAAN PENUNJANG</h2>
        <div class="fields lined">
          <label><span>Laboratorium<br><small>(Darah/Urin/Antigen)</small></span><textarea name="laboratorium" rows="3"></textarea></label>
        </div>
      </section>

      <section class="form-section">
        <h2>TERAPI</h2>
        <div class="fields lined">
          <label><span></span><textarea name="terapi" rows="2"></textarea></label>
        </div>
      </section>

      <section class="form-section discharge-section">
        <h2>KELUAR</h2>
        <div class="discharge-row">
          <label class="field-label" for="cara_keluar">Cara Keluar</label>
          <div class="discharge-options">
            <label><input type="radio" name="cara_keluar" value="Sembuh"> Sembuh</label>
            <label><input type="radio" name="cara_keluar" value="Meninggal"> Meninggal</label>
            <label><input type="radio" name="cara_keluar" value="Pulang Paksa"> Pulang Paksa</label>
            <label><input type="radio" name="cara_keluar" value="Rujuk"> Rujuk</label>
            <small>(Beri Lingkaran)</small>
          </div>
        </div>
        <div class="fields lined">
          <label><span>Alasan Rujuk</span><textarea name="alasan_rujuk" rows="1"></textarea></label>
          <label><span>Catatan</span><textarea name="catatan" rows="2"></textarea></label>
        </div>
      </section>

      <footer class="signature">
        <div class="place-date">Pasuruan, <input name="tanggal_dokumen" type="date" aria-label="Tanggal dokumen"></div>
        <div class="doctor-title">Dokter Penanggung Jawab</div>
        <input class="doctor-name" name="nama_dokter" type="text" aria-label="Nama dokter penanggung jawab" placeholder="Nama dan gelar dokter">
      </footer>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
